name: Feature request
description: Propose a user-visible improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired user outcome
      description: What should a user be able to observe or accomplish?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current limitation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe behavior and compatibility expectations, not only implementation details.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: contracts
    attributes:
      label: Compatibility and product contracts
      description: Note any data, workflow, permission, or automation behavior that must remain unchanged.
