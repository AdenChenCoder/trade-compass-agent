name: CI

on:
  push:
    branches-ignore:
      - "dependabot/**"
  pull_request:

permissions:
  contents: read

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==0.11.32"
      - name: Install locked project dependencies
        run: uv sync --locked --extra dev
      - name: Run Python governance checks
        run: scripts/ci_check.sh
        env:
          PYTHONPATH: src

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Vite web app
        run: pnpm --dir apps/web build
      - name: Typecheck web app
        run: pnpm --dir apps/web typecheck
      - name: Test web app
        run: pnpm --dir apps/web test

  wheel-smoke:
    runs-on: ubuntu-latest
    needs: [web-build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build distributions and verify installed quickstart
        run: |
          python -m pip install "uv==0.11.32"
          uv build --no-sources
          python scripts/check_dist.py
          python -m pip install dist/*.whl
          export TRADE_COMPASS_HOME="$RUNNER_TEMP/trade-compass-home"
          export DEEPSEEK_API_KEY="ci-placeholder"
          cd "$RUNNER_TEMP"
          trade-compass --version
          trade-compass commands --json
          trade-compass setup
          trade-compass doctor
          python -m trade_compass_agent.release_smoke
          python - <<'PY'
          import os
          from pathlib import Path

          import trade_compass_agent.web.dist as dist
          from trade_compass_agent.config import (
              PACKAGE_ROOT,
              load_app_config,
              resolve_config_path,
              resolve_schema_path,
          )

          path = dist.resolve_web_dist()
          assert path is not None, "web_dist missing from installed wheel"
          assert (path / "index.html").is_file()
          print(f"web_dist ok: {path}")
          assert (PACKAGE_ROOT / "workflows" / "catalyst_calendar_cn" / "workflow.yaml").is_file()
          assert (PACKAGE_ROOT / "specialists" / "equity_research" / "specialist.yaml").is_file()
          assert resolve_schema_path("readers/reader_claims.schema.json").is_file()
          config = load_app_config()
          home = Path(os.environ["TRADE_COMPASS_HOME"])
          assert resolve_config_path().resolve() == (home / "config.yaml").resolve()
          assert config.data_dir.resolve() == (home / "data").resolve()
          assert config.memory_dir.resolve() == (home / "memory_vault").resolve()
          assert config.llm.provider == "deepseek"
          assert not str(config.data_dir).startswith(str(PACKAGE_ROOT))
          print("installed config, runtime paths, and package assets ok")
          PY
