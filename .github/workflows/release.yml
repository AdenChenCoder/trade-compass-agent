name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan complete Git history
        run: scripts/secret_scan.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install workspace and project dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install "uv==0.11.32"
          uv sync --locked --extra dev
      - name: Prepare and test mobile UI
        run: |
          pnpm --dir apps/mobile test
          pnpm --dir apps/mobile build
      - name: Verify Python project
        run: scripts/ci_check.sh
        env:
          PYTHONPATH: src
      - name: Verify web app
        run: |
          pnpm --dir apps/web test
          pnpm --dir apps/web typecheck
          pnpm --dir apps/web build

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          cache-dependency-path: scripts/mobile-funnel-probe/go.sum
      - name: Verify mobile connection component
        working-directory: scripts/mobile-funnel-probe
        run: go test -race ./...
      - name: Build distributions
        run: |
          python -m pip install "uv==0.11.32"
          uv build --no-sources
          python scripts/check_dist.py
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match package version {version!r}")
          PY
      - name: Verify the exact wheel as an installed consumer
        run: |
          python -m venv "$RUNNER_TEMP/release-smoke"
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          export TRADE_COMPASS_HOME="$RUNNER_TEMP/trade-compass-home"
          "$RUNNER_TEMP/release-smoke/bin/trade-compass" --version
          "$RUNNER_TEMP/release-smoke/bin/trade-compass" commands --json
          "$RUNNER_TEMP/release-smoke/bin/python" -m trade_compass_agent.release_smoke
      - name: Build release SBOM and checksums
        run: |
          mkdir -p release-assets
          cp dist/* release-assets/
          cp install.sh release-assets/
          uv export --quiet \
            --locked \
            --format cyclonedx1.5 \
            --all-extras \
            --all-groups \
            --no-emit-project \
            --output-file release-assets/sbom.cdx.json
          cd release-assets
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/trade-compass-agent/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  postpublish:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install and accept the published package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python -m venv "$RUNNER_TEMP/postpublish"
          for attempt in 1 2 3 4 5; do
            if "$RUNNER_TEMP/postpublish/bin/python" -m pip install \
              "trade-compass-agent==$VERSION"; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              exit 1
            fi
            sleep 15
          done
          cd "$RUNNER_TEMP"
          export TRADE_COMPASS_HOME="$RUNNER_TEMP/trade-compass-home"
          "$RUNNER_TEMP/postpublish/bin/trade-compass" --version
          "$RUNNER_TEMP/postpublish/bin/trade-compass" commands --json
          "$RUNNER_TEMP/postpublish/bin/python" -m trade_compass_agent.release_smoke
      - name: Accept the published one-command installer
        run: |
          export HOME="$RUNNER_TEMP/installer-home"
          export TRADE_COMPASS_PACKAGE="trade-compass-agent==${GITHUB_REF_NAME#v}"
          sh install.sh
          test ! -e "$HOME/.trade-compass/config.yaml"
          if command -v uv >/dev/null 2>&1; then
            uv_bin="$(command -v uv)"
          else
            uv_bin="$HOME/.local/bin/uv"
          fi
          tool_bin="$("$uv_bin" tool dir --bin)"
          "$tool_bin/trade-compass" --version

  github-release:
    needs: postpublish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: release-assets
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-assets/*
          generate_release_notes: true
