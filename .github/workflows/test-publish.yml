name: TestPyPI Publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan complete Git history
        run: scripts/secret_scan.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: pnpm
      - name: Install workspace and project dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install "uv==0.11.32"
          uv sync --locked --extra dev
      - name: Verify project
        run: |
          scripts/ci_check.sh
          pnpm --dir apps/web test
          pnpm --dir apps/web typecheck
        env:
          PYTHONPATH: src
      - name: Build distributions
        run: |
          uv build --no-sources
          python scripts/check_dist.py
      - name: Verify the exact wheel as an installed consumer
        run: |
          python -m venv "$RUNNER_TEMP/release-smoke"
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          export TRADE_COMPASS_HOME="$RUNNER_TEMP/trade-compass-home"
          "$RUNNER_TEMP/release-smoke/bin/trade-compass" --version
          "$RUNNER_TEMP/release-smoke/bin/python" -m trade_compass_agent.release_smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/trade-compass-agent
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: test-python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  postpublish:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Download the TestPyPI wheel and resolve dependencies from PyPI
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          mkdir -p "$RUNNER_TEMP/testpypi-wheel"
          for attempt in 1 2 3 4 5; do
            if python -m pip download \
              --index-url https://test.pypi.org/simple/ \
              --no-deps \
              --only-binary=:all: \
              --dest "$RUNNER_TEMP/testpypi-wheel" \
              "trade-compass-agent==$VERSION"; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              exit 1
            fi
            sleep 15
          done
          python -m venv "$RUNNER_TEMP/testpypi-smoke"
          "$RUNNER_TEMP/testpypi-smoke/bin/python" -m pip install \
            "$RUNNER_TEMP"/testpypi-wheel/*.whl
          cd "$RUNNER_TEMP"
          export TRADE_COMPASS_HOME="$RUNNER_TEMP/trade-compass-home"
          "$RUNNER_TEMP/testpypi-smoke/bin/trade-compass" --version
          "$RUNNER_TEMP/testpypi-smoke/bin/python" -m trade_compass_agent.release_smoke
