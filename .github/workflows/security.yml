name: Security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan complete Git history
        run: scripts/secret_scan.sh
