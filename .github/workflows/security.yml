name: Security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan complete Git history
        run: scripts/secret_scan.sh

  dependency-audit:
    name: Locked dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: pnpm
      - name: Audit locked Python dependencies
        run: |
          python -m pip install "uv==0.11.32"
          uv sync --locked --extra dev
          mkdir -p "$RUNNER_TEMP/python-audit"
          uv export --quiet \
            --locked \
            --format pylock.toml \
            --all-extras \
            --all-groups \
            --no-emit-project \
            --output-file "$RUNNER_TEMP/python-audit/pylock.toml"
          uv run --locked --extra dev pip-audit \
            --locked \
            --progress-spinner off \
            "$RUNNER_TEMP/python-audit"
      - name: Audit locked Web dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm audit
          pnpm audit signatures
