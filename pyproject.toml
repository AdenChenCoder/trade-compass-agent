[project]
name = "trade-compass-agent"
version = "0.2.0rc2"
description = "交易罗盘: local-first A-share trading agent workbench for short-term trading, ETF rotation, simulation, review, and memory-driven improvement."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/trade_compass_agent/data/kronos/LICENSE"]
authors = [{ name = "Trade Compass Agent" }]
keywords = ["a-share", "agent", "trading", "local-first", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.0,<3",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.30,<1",
  "pandas>=2.2,<4",
  "numpy>=2.0,<3",
  "akshare>=1.15,<2",
  "baostock>=0.8,<1",
  "python-dotenv>=1.0,<2",
  "duckduckgo-search>=7.0,<9",
  "openai>=1.0,<3",
]

[project.urls]
Homepage = "https://github.com/AdenChenCoder/trade-compass-agent"
Documentation = "https://github.com/AdenChenCoder/trade-compass-agent/tree/main/docs"
Repository = "https://github.com/AdenChenCoder/trade-compass-agent"
Issues = "https://github.com/AdenChenCoder/trade-compass-agent/issues"
Changelog = "https://github.com/AdenChenCoder/trade-compass-agent/blob/main/CHANGELOG.md"

[project.optional-dependencies]
tushare = [
  "tushare>=1.4",
]
llm = [
  "anthropic>=0.39",
]
search = [
  "tavily-python>=0.5",
]
mcp = [
  "mcp>=1.0",
]
quant = [
  "vectorbt>=0.26",
  "backtrader>=1.9",
]
channels = [
  "lark_oapi>=1.6",
  "websockets>=13.0",
  "aiohttp>=3.9",
]
chart = [
  "mplfinance>=0.12",
  "matplotlib>=3.8",
]
forecast = [
  "torch>=2.0.0",
  "einops>=0.8",
  "huggingface_hub>=0.30",
  "safetensors>=0.4",
]
vision = [
  "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
  "pytesseract>=0.3; sys_platform != 'darwin'",
  "Pillow>=10.0; sys_platform != 'darwin'",
  "pypdf>=4.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "httpx>=0.27",
  "jsonschema>=4.0",
  "matplotlib>=3.8",
]

[project.scripts]
trade-compass = "trade_compass_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trade_compass_agent"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "trade_compass_agent/schemas"
"config/packaged.yaml" = "trade_compass_agent/default.yaml"
"config/agent_skills.yaml" = "trade_compass_agent/agent_skills.yaml"
".trade-compass/skills" = "trade_compass_agent/builtin_skills"
".env.example" = "trade_compass_agent/env.example"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.uv-cache",
  "/apps/web/*.tsbuildinfo",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
