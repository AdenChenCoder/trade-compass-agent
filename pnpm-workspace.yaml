packages:
  - "apps/*"
overrides:
  browserslist: 4.28.7
  nanoid: 3.3.18
  postcss: 8.5.24
  postcss-selector-parser: 6.1.3
  # xcode only uses uuid.v4(); v11 retains its CommonJS API and fixes GHSA-w5hq-g745-h8pq.
  "xcode>uuid": 11.1.1
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
auditConfig:
  ignoreGhsas:
    # Upstream patched the v7 line in 7.18.2; this SPA does not use RSC APIs.
    # Keep the exception until the package-audit advisory range is corrected.
    - GHSA-qwww-vcr4-c8h2
