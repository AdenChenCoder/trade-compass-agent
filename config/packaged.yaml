profile: local
data_dir: ./data
memory_dir: ./memory_vault
rules:
  enabled: true
  char_limit: 4000
data_provider: auto
data:
  tushare_enabled: false
  tushare_token_env: TUSHARE_TOKEN
  cninfo_enabled: true
trading_costs:
  commission_rate: 0.0003
  min_commission: 5.0
  stamp_duty_rate: 0.0005
  transfer_fee_rate: 0.00001
  slippage_bps: 5.0
  min_lot_size: 100
  price_limit_pct: 0.10
  st_price_limit_pct: 0.05
scheduler:
  enabled: true
  timezone: Asia/Shanghai
  premarket_time: "08:50"
  morning_plan_time: "09:15"
  close_time: "15:10"
  eod_review_time: "15:30"
  postmarket_time: "16:30"
  weekly_day: sat
  weekly_time: "10:00"
notifications:
  enabled: true
  channels: ["web_log"]
  macos_enabled: false
  max_records: 500
privacy:
  # Controls extra LLM-based learning/curation. Normal agent requests still
  # include applicable user rules and memory context; see PRIVACY.md.
  allow_external_llm_memory: false
memory:
  governance:
    agent_add_confidence: 0.4
    min_inject_confidence: 0.5
    legacy_promotion_fallback: false
    outcome_feedback_enabled: true
    outcome_confidence_delta: -0.15
    outcome_min_confidence_delta: -0.05
    outcome_max_confidence_delta: -0.30
    outcome_advisor_enabled: false
    outcome_advisor_max_candidates: 5
    disproof_pnl_delta: 5.0
    min_predicted_magnitude: 3.0
    alert_drop_threshold: 8.0
    outcome_return_delta: 5.0
    alert_signal_enabled: false
    archive_after_disproofs: 2
  promotion:
    default_confidence: 0.85
    grounding_in_judge: true
    auto_supersede: true
  recall:
    index_knowledge_in_fts: false
    sanitize_reflections: true
  curator:
    enabled: true
    stale_days: 90
    scan_conflicts: true
agent:
  require_llm: true
  max_tool_rounds: 30
  learning_enabled: false
  multimodal: true
  llm_session_titles: false
context_compression:
  enabled: true
  chars_per_token: 1.5
  trim_threshold_pct: 0.60
  summary_threshold_pct: 0.80
  emergency_threshold_pct: 0.95
  protect_recent_count: 20
  protect_recent_tokens: 16000
  context_budget: 0
llm:
  provider: deepseek
  model: deepseek-chat
  api_key_env: DEEPSEEK_API_KEY
  timeout: 60.0
  max_retries: 2
  vision_model: ""
  vision_provider: ""
  vision_api_key_env: ""
debate:
  max_debate_rounds: 2
  enable_research_phase: true
  enable_risk_crossexam: true
  analyst_max_tool_rounds: 4
  debater_max_tool_rounds: 3
channels:
  gateway_enabled: false
  feishu_enabled: false
  wecom_enabled: false
  weixin_enabled: false
watchlists:
  stocks: ["600519", "300750", "000001"]
  etfs: ["510300", "512690", "159915"]
  mid_term: ["600519", "510300"]
